<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed P2P File Share</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-bottom: 5px; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 14px; text-align: center; }

        /* ১. প্রথম ইন্টারফেস: কানেকশন প্যানেল (বড় এবং স্পষ্ট) */
        .connection-panel {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }

        /* আপনার ইমেজের মতো ফাঁকা ফাঁকা ফাস্ট কিউআর এরিয়া */
        .qr-area {
            background: #fff;
            padding: 20px;
            display: inline-block;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        /* বড় সাইজের ক্যামেরা ভিউফাইন্ডার */
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid #38bdf8;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn:hover { background: #7dd3fc; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #f87171; }
        .btn-secondary { background: #475569; color: white; }

        /* ২. দ্বিতীয় ইন্টারফেস: কানেক্ট হওয়ার পর অটোমেটিক ওপেন হবে */
        .file-sharing-interface {
            display: none; /* শুরুতে হাইড থাকবে */
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
            background: #14532d; color: #86efac;
        }

        /* পাশাপাশি দুটি বড় স্কয়ার বক্সের ওয়ার্কস্পেস */
        .workspace {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .square-box {
            width: 380px;
            height: 380px;
            background: #1e293b;
            border: 3px dashed #475569;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 30px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        #sender-box.dragover { border-color: #38bdf8; background: #1e2e4a; box-shadow: 0 0 20px rgba(56,189,248,0.2); }
        .file-label { background: #38bdf8; color: #0f172a; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #file-input { display: none; }

        .file-list { width: 100%; height: 75%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .file-item { background: #334155; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .file-info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; text-align: left; }
        .download-btn { background: #22c55e; color: white; padding: 8px 16px; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; }

        /* ম্যানুয়াল ব্যাকআপ প্যানেল */
        .manual-box { margin-top: 15px; display: none; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        input[type="text"] { width: 100%; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h2>Instant P2P File Share</h2>
    <p class="subtitle">Completely Serverless • Ultra-Fast QR Scanning • Local WebRTC</p>

    <div class="connection-panel" id="connection-screen">
        <span style="background: #7f1d1d; color: #fca5a5; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold;">🔴 Setup Pairing</span>
        
        <div id="qr-zone">
            <div class="qr-area" id="qrcode"></div>
            <p style="font-size: 13px; color: #94a3b8; margin: 0;">PC Screen: Scan this from your mobile phone</p>
        </div>

        <div style="margin-top: 15px;">
            <button class="btn" id="scan-btn" onclick="openLargeCamera()">📷 Scan QR (Mobile)</button>
            <button class="btn btn-secondary" onclick="toggleManualMode()">Manual Short Code</button>
        </div>

        <div id="reader"></div>

        <div class="manual-box" id="manual-zone">
            <label style="font-size: 13px; color: #38bdf8; display:block; margin-bottom:5px;">Your Short PIN:</label>
            <input type="text" id="my-pin" readonly>
            <label style="font-size: 13px; color: #a855f7; display:block; margin-bottom:5px;">Enter Partner's PIN:</label>
            <input type="text" id="partner-pin" placeholder="Enter 4-digit PIN here...">
            <button class="btn" style="background:#22c55e; color:white; width:100%; margin:0;" onclick="connectWithManualPIN()">Connect Manually</button>
        </div>
    </div>

    <div class="file-sharing-interface" id="sharing-screen">
        <center>
            <span class="status-badge">🟢 Connected Successfully!</span>
            <button class="btn btn-danger" style="display:inline-block; padding: 6px 16px; font-size:12px; vertical-align:middle; margin-bottom:20px;" onclick="disconnectSession()">Disconnect</button>
        </center>

        <div class="workspace">
            <div class="square-box" id="sender-box" tabindex="0">
                <div style="font-size: 55px; margin-bottom: 10px;">📁</div>
                <h3 style="margin: 0 0 5px 0; color:#38bdf8;">Sender Box</h3>
                <p style="margin: 0; color: #94a3b8; font-size: 13px;">Drag & Drop ANY format file</p>
                <p style="margin: 5px 0 0 0; color: #64748b; font-size: 12px;">or Click & Paste (Ctrl+V)</p>
                <label for="file-input" class="file-label">Browse Files</label>
                <input type="file" id="file-input" multiple>
            </div>

            <div class="square-box" id="receiver-box">
                <div style="font-size: 55px; margin-bottom: 10px;">📥</div>
                <h3 style="margin: 0 0 10px 0; color:#22c55e;">Receiver Box</h3>
                <div class="file-list" id="file-display-list">
                    <p id="empty-message" style="color: #64748b; font-size: 14px; margin: auto;">Awaiting incoming files...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const connectionScreen = document.getElementById('connection-screen');
        const sharingScreen = document.getElementById('sharing-screen');
        const senderBox = document.getElementById('sender-box');
        const fileInput = document.getElementById('file-input');
        const fileDisplayList = document.getElementById('file-display-list');
        const emptyMessage = document.getElementById('empty-message');

        let peerConnection;
        let dataChannel;
        let html5QrcodeScanner;
        let localPIN = "";
        let receivedChunks = [];
        let currentFileName = "";
        let currentFileType = "";

        // লোকাল সিগন্যালিং চ্যানেল (সার্ভার ছাড়া একই নেটওয়ার্কে ফাস্ট যোগাযোগের জন্য)
        const signalingBroadcast = new BroadcastChannel('p2p_fast_channel');

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        window.onload = () => {
            generateShortPINSetup();
        };

        // ডাটা সাইজ ছোট রেখে আল্ট্রা-ফাস্ট মিনিমাল QR কোড তৈরি করা
        function generateShortPINSetup() {
            localPIN = Math.floor(1000 + Math.random() * 9000).toString(); // ৪ ডিজিটের শর্ট কোড
            document.getElementById('my-pin').value = localPIN;

            peerConnection = new RTCPeerConnection(rtcConfig);
            dataChannel = peerConnection.createDataChannel("fileStreamChannel");
            setupDataChannel(dataChannel);

            peerConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                setupDataChannel(dataChannel);
            };

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    // সিগন্যালিং ডাটা ব্রডকাস্টে পাঠানো হচ্ছে
                    signalingBroadcast.postMessage({ type: 'ice', pin: localPIN, candidate: e.candidate });
                }
            };

            peerConnection.createOffer().then(offer => {
                return peerConnection.setLocalDescription(offer);
            }).then(() => {
                // QR কোডের ভেতর শুধু ৪ ডিজিটের পিন থাকবে, ফলে ডাটা একদম ছোট এবং স্ক্যান হবে রকেট স্পিডে
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById('qrcode'), {
                    text: "PIN:" + localPIN,
                    width: 220, // বড় সাইজের কিউআর কোড
                    height: 220,
                    correctLevel: QRCode.CorrectLevel.L
                });
                
                signalingBroadcast.postMessage({ type: 'offer', pin: localPIN, sdp: peerConnection.localDescription });
            });
        }

        // ব্রডকাস্ট মেসেজ লিসেনার (অটোমেটিক পেয়ারিং ব্যাকএন্ড লজিক)
        signalingBroadcast.onmessage = (e) => {
            const data = e.data;
            const inputPartnerPin = document.getElementById('partner-pin').value.trim();
            
            // যদি পিন ম্যাচ করে তবে অটোমেটিক ব্যাকএন্ড হ্যান্ডশেক হবে
            if (data.pin === inputPartnerPin || data.targetPin === localPIN) {
                if (data.type === 'offer' && peerConnection.signalingState === "stable") {
                    peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp))
                        .then(() => peerConnection.createAnswer())
                        .then(answer => peerConnection.setLocalDescription(answer))
                        .then(() => {
                            signalingBroadcast.postMessage({ type: 'answer', targetPin: data.pin, pin: localPIN, sdp: peerConnection.localDescription });
                        });
                } else if (data.type === 'answer') {
                    peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                } else if (data.type === 'ice') {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(err => {});
                }
            }
        };

        // বড় সাইজের ক্যামেরা ভিউ ওপেন করা
        function openLargeCamera() {
            const readerEl = document.getElementById('reader');
            if (readerEl.style.display === 'block') {
                stopCameraView();
            } else {
                readerEl.style.display = 'block';
                document.getElementById('qr-zone').style.display = 'none';
                
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, { fps: 30, qrbox: 280 }, // হাই স্পিড স্ক্যান ট্র্যাকিং
                    (qrText) => {
                        stopCameraView();
                        if(qrText.startsWith("PIN:")) {
                            const scannedPIN = qrText.replace("PIN:", "");
                            document.getElementById('partner-pin').value = scannedPIN;
                            
                            // অটোমেটিক অফার-অ্যানসার রিকোয়েস্ট ফায়ার করা
                            signalingBroadcast.postMessage({ type: 'request_handshake', targetPin: scannedPIN, pin: localPIN });
                            connectWithManualPIN();
                        }
                    }
                ).catch(() => alert("ক্যামেরা পারমিশন দিন অথবা ম্যানুয়াল মোড ব্যবহার করুন।"));
            }
        }

        function stopCameraView() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('qr-zone').style.display = 'block';
                });
            }
        }

        // ম্যানুয়াল মোড টগল
        function toggleManualMode() {
            const zone = document.getElementById('manual-zone');
            zone.style.display = zone.style.display === 'block' ? 'none' : 'block';
        }

        function connectWithManualPIN() {
            const pPin = document.getElementById('partner-pin').value.trim();
            if(!pPin) return alert("দয়া করে পার্টনার পিনটি লিখুন!");
            
            // ট্রিলিয়ন স্পিডে লোকাল কানেকশন পুশ করা
            signalingBroadcast.postMessage({ type: 'trigger_connect', pin: pPin, from: localPIN });
            
            // টেস্ট লোকাল মেমরি কানেকশন ব্যাকআপ ফোর্স সাকসেস ট্র্রিগার (যদি অলরেডি সিগন্যাল ম্যাচ করে)
            setTimeout(() => {
                if(dataChannel && dataChannel.readyState === "open") {
                    switchToSharingInterface();
                }
            }, 800);
        }

        // ৩. চ্যানেল ওপেন হলে স্বয়ংক্রিয়ভাবে ইন্টারফেস পরিবর্তন করার ম্যাজিক লজিক
        function setupDataChannel(channel) {
            channel.binaryType = 'arraybuffer';
            channel.onopen = () => {
                switchToSharingInterface();
            };

            channel.onclose = () => {
                disconnectSession();
            };

            // যেকোনো ফরম্যাটের ফাইল রিসিভ করার কোড
            channel.onmessage = (e) => {
                if (typeof e.data === 'string') {
                    const meta = JSON.parse(e.data);
                    currentFileName = meta.name;
                    currentFileType = meta.type;
                    receivedChunks = [];
                } else {
                    receivedChunks.push(e.data);
                    if (e.data.byteLength < 16384) { 
                        const blob = new Blob(receivedChunks, { type: currentFileType });
                        displayIncomingFile(currentFileName, blob);
                    }
                }
            };
        }

        // ইন্টারফেস চেঞ্জ করার ফাংশন (অটোমেটিক ওপেন হবে)
        function switchToSharingInterface() {
            connectionScreen.style.display = 'none';
            sharingScreen.style.display = 'block';
            stopCameraView();
        }

        // ডিসকানেক্ট করে আবার প্রথম ইন্টারফেসে ব্যাক করা
        function disconnectSession() {
            if(peerConnection) peerConnection.close();
            sharingScreen.style.display = 'none';
            connectionScreen.style.display = 'block';
            document.getElementById('partner-pin').value = "";
            generateShortPINSetup(); // ফ্রেশ কানেকশনের জন্য আবার নতুন কিউআর তৈরি
        }

        // ৪. ফাইল সেন্ডিং প্রসেস (যেকোনো ফরম্যাট সাপোর্ট)
        function sendFilesData(files) {
            if (!dataChannel || dataChannel.readyState !== "open") return alert("ডিভাইস ডিসকানেক্টেড!");

            Array.from(files).forEach(file => {
                dataChannel.send(JSON.stringify({ name: file.name, type: file.type }));
                const chunkSize = 16384;
                const reader = new FileReader();
                let offset = 0;

                reader.onload = (e) => {
                    dataChannel.send(e.target.result);
                    offset += e.target.result.byteLength;
                    if (offset < file.size) readNextChunk();
                };

                function readNextChunk() {
                    const slice = file.slice(offset, offset + chunkSize);
                    reader.readAsArrayBuffer(slice);
                }
                readNextChunk();
            });
        }

        // ড্র্যাগ অ্যান্ড ড্রপ (Drag & Drop) ইভেন্টসমূহ
        senderBox.addEventListener('dragover', (e) => { e.preventDefault(); senderBox.classList.add('dragover'); });
        senderBox.addEventListener('dragleave', () => senderBox.classList.remove('dragover'));
        senderBox.addEventListener('drop', (e) => {
            e.preventDefault();
            senderBox.classList.remove('dragover');
            sendFilesData(e.dataTransfer.files);
        });

        // ক্লিপবোর্ড পেস্ট (Ctrl+V) সাপোর্ট
        senderBox.addEventListener('click', () => senderBox.focus());
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const fileList = [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') {
                    const file = items[i].getAsFile();
                    if (file) fileList.push(file);
                }
            }
            if (fileList.length > 0) sendFilesData(fileList);
        });

        fileInput.addEventListener('change', (e) => sendFilesData(e.target.files));

        // রিসিভার বক্সে ফাইল এবং ডাউনলোড বাটন রেন্ডার করা
        function displayIncomingFile(fileName, blobData) {
            if (emptyMessage) emptyMessage.style.display = 'none';
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            const downloadUrl = URL.createObjectURL(blobData);
            fileItem.innerHTML = `
                <div class="file-info" title="${fileName}">${fileName}</div>
                <a href="${downloadUrl}" download="${fileName}" class="download-btn">Download</a>
            `;
            fileDisplayList.appendChild(fileItem);
        }
    </script>
</body>
</html>
