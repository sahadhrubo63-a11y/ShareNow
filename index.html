<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Serverless P2P File Share</title>
    <!-- GitHub Pages এবং অফলাইন সাপোর্টের জন্য সরাসরি CDN লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-bottom: 5px; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 14px; text-align: center; }

        .connection-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .disconnected { background: #7f1d1d; color: #fca5a5; }
        .connected { background: #14532d; color: #86efac; }

        .qr-area {
            background: #fff;
            padding: 15px;
            margin: 15px auto;
            display: inline-block;
            border-radius: 8px;
        }
        
        #reader {
            width: 100%;
            max-width: 300px;
            margin: 15px auto;
            border-radius: 8px;
            overflow: hidden;
        }

        .btn {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            font-size: 13px;
        }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-success { background: #22c55e; color: white; }

        .workspace {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }

        .square-box {
            width: 320px;
            height: 320px;
            background: #1e293b;
            border: 3px dashed #475569;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
            outline: none;
        }

        #sender-box.dragover { border-color: #38bdf8; background: #1e2e4a; }
        .file-label { background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 15px; }
        #file-input { display: none; }

        .file-list { width: 100%; height: 70%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .file-item { background: #334155; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .file-info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .download-btn { background: #22c55e; color: white; padding: 6px 12px; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; }

        .token-container {
            margin-top: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        textarea {
            width: 100%;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
            font-family: monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <h2>Instant P2P File Share</h2>
    <p class="subtitle">Scan QR to connect. Device B will auto-generate partner token after scanning Device A!</p>

    <!-- কানেকশন প্যানেল -->
    <div class="connection-panel">
        <span id="connection-status" class="status-badge disconnected">🔴 Disconnected</span>
        
        <div>
            <button class="btn btn-primary" onclick="startAsHost()">1. Init Connection (Device A)</button>
            <button class="btn btn-primary" onclick="startAsReceiver()">2. Scan QR (Device B)</button>
        </div>

        <!-- QR Code Display -->
        <div id="qr-wrapper" style="display:none;">
            <div class="qr-area" id="qrcode"></div>
            <p id="qr-instruction" style="font-size: 12px; color: #94a3b8; margin: 5px 0;">Scan this QR from the other device</p>
        </div>

        <!-- Camera Scanner Display -->
        <div id="scanner-wrapper" style="display:none;">
            <div id="reader"></div>
            <button class="btn" onclick="stopCamera()">Stop Camera</button>
        </div>

        <!-- টোকেন ব্যাকআপ এরিয়া -->
        <div class="token-container" id="token-area" style="display: none;">
            <label style="font-size: 12px; color: #38bdf8; display:block; margin-bottom:5px;">Your Connection Token:</label>
            <textarea id="token-output" rows="2" readonly onclick="this.select()"></textarea>
            <button class="btn" id="copy-btn" onclick="copyToken()">Copy Token</button>
            
            <hr style="border-color: #334155; margin: 10px 0;">
            
            <label style="font-size: 12px; color: #a855f7; display:block; margin-bottom:5px;">Manual Backup: Paste Partner's Token Here</label>
            <textarea id="token-input" rows="2" placeholder="Paste token manually if scanning fails..."></textarea>
            <button class="btn btn-success" onclick="handleManualToken()">Connect Manually</button>
        </div>
    </div>

    <!-- ওয়ার্কস্পেস (পাশাপাশি দুইটি স্কয়ার বক্স) -->
    <div class="workspace">
        <div class="square-box" id="sender-box" tabindex="0">
            <div style="font-size: 40px; margin-bottom: 10px;">📁</div>
            <p style="margin: 0 0 5px 0; font-weight: 500;">Drag & Drop files here</p>
            <p style="margin: 0; color: #64748b; font-size: 13px;">or Click & Paste (Ctrl+V)</p>
            <label for="file-input" class="file-label">Browse Files</label>
            <input type="file" id="file-input" multiple>
        </div>

        <div class="square-box" id="receiver-box">
            <div style="font-size: 40px; margin-bottom: 10px;">📥</div>
            <p style="margin: 0 0 10px 0; font-weight: 500;">Received Files</p>
            <div class="file-list" id="file-display-list">
                <p id="empty-message" style="color: #94a3b8; font-size: 14px; margin: auto;">No files received yet.</p>
            </div>
        </div>
    </div>

    <script>
        const senderBox = document.getElementById('sender-box');
        const fileInput = document.getElementById('file-input');
        const fileDisplayList = document.getElementById('file-display-list');
        const emptyMessage = document.getElementById('empty-message');
        const statusBadge = document.getElementById('connection-status');
        const tokenArea = document.getElementById('token-area');
        const tokenOutput = document.getElementById('token-output');
        const tokenInput = document.getElementById('token-input');
        const qrInstruction = document.getElementById('qr-instruction');

        let peerConnection;
        let dataChannel;
        let html5QrcodeScanner;
        let receivedChunks = [];
        let currentFileName = "";
        let currentFileType = "";

        // লোকাল নেটওয়ার্কে অফলাইনে কাজ করার জন্য কনফিগারেশন
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; 

        // ১. ডিভাইস এ (পিসি/সেন্ডার) কানেকশন শুরু করার জন্য
        function startAsHost() {
            showTokenArea();
            qrInstruction.innerText = "Device B দিয়ে এই QR কোডটি স্ক্যান করুন।";
            
            peerConnection = new RTCPeerConnection(rtcConfig);
            dataChannel = peerConnection.createDataChannel("fileTransfer");
            setupDataChannelEvents(dataChannel);

            peerConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    const offerToken = btoa(JSON.stringify(peerConnection.localDescription));
                    tokenOutput.value = "OFFER:" + offerToken;
                    generateQR("OFFER:" + offerToken);
                }
            };
            peerConnection.createOffer().then(offer => peerConnection.setLocalDescription(offer));
        }

        // ২. ডিভাইস বি (মোবাইল) ক্যামেরা দিয়ে স্ক্যান শুরু করার জন্য
        function startAsReceiver() {
            showTokenArea();
            document.getElementById('scanner-wrapper').style.display = 'block';

            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                setupDataChannelEvents(dataChannel);
            };

            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: 250 },
                (qrText) => {
                    processScannedToken(qrText);
                    stopCamera();
                }
            ).catch(err => console.log("Camera failed. Switching to manual backup mode."));
        }

        // ৩. স্ক্যান করা বা ম্যানুয়ালি পেস্ট করা টোকেন প্রসেস করার ফাংশন
        function processScannedToken(qrText) {
            if(qrText.startsWith("OFFER:")) {
                // ডিভাইস B সফলভাবে ডিভাইস A-কে রিড করেছে
                const token = atob(qrText.replace("OFFER:", ""));
                peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(token)))
                    .then(() => peerConnection.createAnswer())
                    .then(answer => peerConnection.setLocalDescription(answer))
                    .then(() => {
                        // AUTOMATIC PART: ডিভাইস B-তে অটোমেটিকভাবে পাল্টা টোকেন ও QR জেনারেট হবে
                        peerConnection.onicecandidate = (e) => {
                            if (!e.candidate) {
                                const answerToken = btoa(JSON.stringify(peerConnection.localDescription));
                                tokenOutput.value = "ANSWER:" + answerToken;
                                qrInstruction.innerText = "অটোমেটিক পার্টনার টোকেন রেডি! এবার এটি Device A দিয়ে স্ক্যান করুন।";
                                generateQR("ANSWER:" + answerToken); 
                            }
                        };
                    });
            } else if(qrText.startsWith("ANSWER:")) {
                // ডিভাইস A যখন ডিভাইস B-এর তৈরি করা অটোমেটিক QR কোডটি স্ক্যান করবে
                const token = atob(qrText.replace("ANSWER:", ""));
                peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(token)));
            }
        }

        // ম্যানুয়াল কানেকশন ব্যাকআপ (যদি স্ক্যান কোনো ডিভাইসে মিস হয়)
        function handleManualToken() {
            const rawToken = tokenInput.value.trim();
            if(!rawToken) return alert("অনুগ্রহ করে বক্সে টোকেনটি পেস্ট করুন!");
            processScannedToken(rawToken);
        }

        // QR কোড জেনারেশন (সহজে রিড করার জন্য অপ্টিমাইজড)
        function generateQR(text) {
            document.getElementById('qr-wrapper').style.display = 'block';
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: text,
                width: 200,
                height: 200,
                correctLevel : QRCode.CorrectLevel.L
            });
        }

        function showTokenArea() { tokenArea.style.display = 'block'; }
        
        function stopCamera() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('scanner-wrapper').style.display = 'none';
                });
            }
        }

        function copyToken() {
            tokenOutput.select();
            document.execCommand('copy');
            const btn = document.getElementById('copy-btn');
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy Token", 2000);
        }

        // ডেটা চ্যানেল কানেকশন ও ফাইল রিসিভ হ্যান্ডলার
        function setupDataChannelEvents(channel) {
            channel.binaryType = 'arraybuffer';
            channel.onopen = () => {
                statusBadge.className = "status-badge connected";
                statusBadge.innerText = "🟢 Connected Successfully!";
                document.getElementById('qr-wrapper').style.display = 'none';
                tokenArea.style.display = 'none';
                stopCamera();
            };
            channel.onclose = () => {
                statusBadge.className = "status-badge disconnected";
                statusBadge.innerText = "🔴 Disconnected";
            };
            channel.onmessage = (e) => {
                if (typeof e.data === 'string') {
                    const meta = JSON.parse(e.data);
                    currentFileName = meta.name;
                    currentFileType = meta.type;
                    receivedChunks = [];
                } else {
                    receivedChunks.push(e.data);
                    if (e.data.byteLength < 16384) { 
                        const blob = new Blob(receivedChunks, { type: currentFileType });
                        displayReceivedFile(currentFileName, blob);
                    }
                }
            };
        }

        // ফাইল ড্রপ বা সিলেক্ট হলে পাঠানোর লজিক
        function handleFiles(files) {
            if (!dataChannel || dataChannel.readyState !== "open") {
                return alert("ডিভাইস এখনো কানেক্ট হয়নি! অনুগ্রহ করে টোকেন বা QR কোড ব্যবহার করুন।");
            }
            Array.from(files).forEach(file => {
                dataChannel.send(JSON.stringify({ name: file.name, type: file.type }));
                const chunkSize = 16384;
                const reader = new FileReader();
                let offset = 0;
                reader.onload = (e) => {
                    dataChannel.send(e.target.result);
                    offset += e.target.result.byteLength;
                    if (offset < file.size) readNextChunk();
                };
                function readNextChunk() {
                    const slice = file.slice(offset, offset + chunkSize);
                    reader.readAsArrayBuffer(slice);
                }
                readNextChunk();
            });
        }

        // UI ড্র্যাগ-অ্যান্ড-ড্রপ এবং কপি-পেস্ট লিসেনার
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        senderBox.addEventListener('dragover', (e) => { e.preventDefault(); senderBox.classList.add('dragover'); });
        senderBox.addEventListener('dragleave', () => senderBox.classList.remove('dragover'));
        senderBox.addEventListener('drop', (e) => { e.preventDefault(); senderBox.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        senderBox.addEventListener('click', () => senderBox.focus());
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const fileList = [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') { const file = items[i].getAsFile(); if (file) fileList.push(file); }
            }
            if (fileList.length > 0) handleFiles(fileList);
        });

        function displayReceivedFile(fileName, blobData) {
            if (emptyMessage) emptyMessage.style.display = 'none';
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            const downloadUrl = URL.createObjectURL(blobData);
            fileItem.innerHTML = `
                <div class="file-info" title="${fileName}">${fileName}</div>
                <a href="${downloadUrl}" download="${fileName}" class="download-btn">Download</a>
            `;
            fileDisplayList.appendChild(fileItem);
        }
    </script>
</body>
</html>
