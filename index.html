<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareNow</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-bottom: 5px; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 14px; text-align: center; }

        .connection-panel {
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        .qr-card {
            background: #ffffff;
            padding: 16px;
            display: inline-block;
            border-radius: 16px;
            margin: 20px 0;
        }

        .room-id-badge {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 4px;
            margin-top: 10px;
            border: 1px solid #334155;
        }
        
        #reader {
            width: 100%;
            max-width: 360px;
            margin: 15px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid #38bdf8;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px;
            font-size: 14px;
        }
        .btn:hover { background: #7dd3fc; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #475569; color: white; }

        /* হিস্ট্রি টেবিল ডিজাইন */
        .history-panel {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        .history-table th, .history-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .history-table th { color: #38bdf8; font-weight: 600; }
        .history-table td { color: #cbd5e1; }

        .file-sharing-interface {
            display: none; 
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
            background: #14532d; color: #86efac;
        }

        .workspace {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .square-box {
            width: 380px;
            height: 380px;
            background: #1e293b;
            border: 3px dashed #475569;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 30px;
            text-align: center;
        }

        .file-label { background: #38bdf8; color: #0f172a; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #file-input { display: none; }
        .file-list { width: 100%; height: 75%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .file-item { background: #334155; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .download-btn { background: #22c55e; color: white; padding: 8px 16px; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; }

        .phone-input-zone { margin-top: 20px; display: none; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        input[type="text"] { width: 100%; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 12px; box-sizing: border-box; text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 15px; letter-spacing: 3px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <h2>ShareNow</h2>
    

    <div class="connection-panel" id="connection-screen">
        <div id="pc-view">
            <span style="background: #1e3a8a; color: #93c5fd; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold;">🖥️ PC SCREEN</span>
            <div class="qr-card" id="qrcode"></div>
            <p style="font-size: 13px; color: #94a3b8; margin: 0 0 5px 0;">Scan this QR Code using Mobile Phone</p>
            <div class="room-id-badge" id="pc-room-id-text">Connecting Server...</div>
        </div>

        <div id="phone-view" style="display: none;">
            <span style="background: #581c87; color: #e9d5ff; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold;">📱 MOBILE PHONE</span>
            <br><br>
            <button class="btn" onclick="openCameraEngine()">📷 Scan PC QR Code</button>
            <button class="btn btn-secondary" onclick="togglePhoneManualBox()">🔢 Connect via Room ID</button>
        </div>

        <div id="reader"></div>

        <div class="phone-input-zone" id="phone-manual-box">
            <label style="font-size: 13px; color: #38bdf8; display:block; margin-bottom:10px;">Enter the Room ID displayed on PC:</label>
            <input type="text" id="input-room-id" placeholder="Ex: 48291" maxlength="5">
            <button class="btn" style="background:#22c55e; color:white; width:100%; margin:0;" onclick="connectWithManualID()">Connect Instantly</button>
        </div>

        <hr style="border-color: #334155; margin: 25px 0 15px 0;">
        <button class="btn btn-secondary" style="font-size:11px; padding:6px 14px;" onclick="switchDeviceModeManual()">Switch PC / Mobile View</button>
    </div>

    <div class="history-panel" id="history-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 16px; color: #38bdf8;">🕒 Connection History</h3>
            <button onclick="clearConnectionHistory()" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">Clear All</button>
        </div>
        <table class="history-table">
            <thead>
                <tr>
                    <th>Connected Device ID</th>
                    <th>Date & Time</th>
                </tr>
            </thead>
            <tbody id="history-rows">
                </tbody>
        </table>
    </div>

    <div class="file-sharing-interface" id="sharing-screen">
        <center>
            <span class="status-badge">🟢 Connected Successfully!</span>
            <button class="btn btn-danger" style="padding: 6px 16px; font-size:12px; vertical-align:middle; margin-bottom:20px;" onclick="window.location.reload()">Disconnect</button>
        </center>

        <div class="workspace">
            <div class="square-box" id="sender-box" tabindex="0">
                <div style="font-size: 55px; margin-bottom: 10px;">📁</div>
                <h3 style="margin: 0 0 5px 0; color:#38bdf8;">Sender Box</h3>
                <label for="file-input" class="file-label">Browse Files</label>
                <input type="file" id="file-input" multiple>
            </div>

            <div class="square-box" id="receiver-box">
                <div style="font-size: 55px; margin-bottom: 10px;">📥</div>
                <h3 style="margin: 0 0 10px 0; color:#22c55e;">Receiver Box</h3>
                <div class="file-list" id="file-display-list">
                    <p id="empty-message" style="color: #64748b; font-size: 14px; margin: auto;">Awaiting incoming files...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const connectionScreen = document.getElementById('connection-screen');
        const sharingScreen = document.getElementById('sharing-screen');
        const historyContainer = document.getElementById('history-container');
        const senderBox = document.getElementById('sender-box');
        const fileInput = document.getElementById('file-input');
        const fileDisplayList = document.getElementById('file-display-list');
        const emptyMessage = document.getElementById('empty-message');

        let myPeer, dataConnection, html5QrcodeScanner;
        let receivedChunks = [];
        let currentFileName = "", currentFileType = "";

        window.onload = () => {
            renderHistoryTable(); // পেজ লোড হওয়ার সাথে সাথে পুরোনো হিস্ট্রি দেখাবে
            if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
                switchDeviceModeManual();
            } else {
                initPCServerNode();
            }
        };

        function initPCServerNode() {
            const generatedID = Math.floor(10000 + Math.random() * 90000).toString();
            myPeer = new Peer(generatedID);

            myPeer.on('open', (id) => {
                document.getElementById('pc-room-id-text').innerText = id;
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById('qrcode'), { text: id, width: 200, height: 200 });
            });

            myPeer.on('connection', (conn) => {
                dataConnection = conn;
                saveToHistory(conn.peer); // পিসিতে রিমোট ফোনের আইডি সেভ হবে
                setupDataChannelEvents();
            });
        }

        // 🔴 হিস্ট্রি লোকাল স্টোরেজে সেভ করার ফাংশন
        function saveToHistory(partnerId) {
            let history = JSON.parse(localStorage.getItem('p2p_conn_history')) || [];
            
            const now = new Date();
            const timeString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // ডুপ্লিকেট এড়াতে একই আইডি পরপর থাকলে রিমুভ করে নতুন টাইমস্ট্যাম্প সেট করবে
            history = history.filter(item => item.id !== partnerId);
            
            history.unshift({ id: partnerId, time: timeString }); // সবার ওপরে নতুন ডেটা রাখবে
            localStorage.setItem('p2p_conn_history', JSON.stringify(history));
            renderHistoryTable();
        }

        // 🔴 হিস্ট্রি টেবিল রেন্ডার করার ফাংশন
        function renderHistoryTable() {
            const history = JSON.parse(localStorage.getItem('p2p_conn_history')) || [];
            const tbody = document.getElementById('history-rows');
            tbody.innerHTML = "";

            if (history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#64748b;">No connection history found</td></tr>`;
                return;
            }

            history.forEach(item => {
                const row = `<tr>
                    <td style="font-family:monospace; font-weight:bold; color:#38bdf8;">Device #${item.id}</td>
                    <td>${item.time}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // 🔴 হিস্ট্রি মুছে ফেলার ফাংশন
        function clearConnectionHistory() {
            localStorage.removeItem('p2p_conn_history');
            renderHistoryTable();
        }

        function openCameraEngine() {
            const readerEl = document.getElementById('reader');
            document.getElementById('phone-manual-box').style.display = 'none';

            if (readerEl.style.display === 'block') {
                stopCameraEngine();
            } else {
                readerEl.style.display = 'block';
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, { fps: 30, qrbox: 250 },
                    (scannedRoomID) => {
                        stopCameraEngine();
                        connectToPCDevice(scannedRoomID);
                    }
                );
            }
        }

        function connectToPCDevice(targetID) {
            myPeer = new Peer();
            myPeer.on('open', () => {
                dataConnection = myPeer.connect(targetID, { reliable: true });
                saveToHistory(targetID); // ফোনে পিসির আইডি হিস্ট্রিতে সেভ হবে
                setupDataChannelEvents();
            });
        }

        function setupDataChannelEvents() {
            dataConnection.on('open', () => {
                connectionScreen.style.display = 'none';
                historyContainer.style.display = 'none'; // কানেক্টেড অবস্থায় হিস্ট্রি প্যানেল হাইড থাকবে
                sharingScreen.style.display = 'block';
            });

            dataConnection.on('data', (data) => {
                if (data.fileMeta) {
                    currentFileName = data.fileMeta.name;
                    currentFileType = data.fileMeta.type;
                    receivedChunks = [];
                } else if (data.fileChunk) {
                    receivedChunks.push(data.fileChunk);
                    if (data.isLast) {
                        const blob = new Blob(receivedChunks, { type: currentFileType });
                        displayFileInReceiver(currentFileName, blob);
                    }
                }
            });

            dataConnection.on('close', () => { window.location.reload(); });
        }

        function stopCameraEngine() { if (html5QrcodeScanner) html5QrcodeScanner.stop().then(() => { document.getElementById('reader').style.display = 'none'; }); }
        function togglePhoneManualBox() { stopCameraEngine(); const box = document.getElementById('phone-manual-box'); box.style.display = box.style.display === 'block' ? 'none' : 'block'; }
        function connectWithManualID() { const targetID = document.getElementById('input-room-id').value.trim(); if (!targetID) return alert("Room ID দিন!"); connectToPCDevice(targetID); }

        function sendTargetFiles(files) {
            if (!dataConnection) return;
            Array.from(files).forEach(file => {
                dataConnection.send({ fileMeta: { name: file.name, type: file.type } });
                const chunkSize = 16384; let offset = 0;
                const reader = new FileReader();
                reader.onload = (e) => {
                    offset += e.target.result.byteLength;
                    const isLast = offset >= file.size;
                    dataConnection.send({ fileChunk: e.target.result, isLast: isLast });
                    if (!isLast) readNextChunk();
                };
                function readNextChunk() { const slice = file.slice(offset, offset + chunkSize); reader.readAsArrayBuffer(slice); }
                readNextChunk();
            });
        }

        senderBox.addEventListener('dragover', (e) => { e.preventDefault(); });
        senderBox.addEventListener('drop', (e) => { e.preventDefault(); sendTargetFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => sendTargetFiles(e.target.files));

        function displayFileInReceiver(name, blob) {
            if (emptyMessage) emptyMessage.style.display = 'none';
            const item = document.createElement('div');
            item.className = 'file-item';
            const url = URL.createObjectURL(blob);
            item.innerHTML = `<div>${name}</div><a href="${url}" download="${name}" class="download-btn">Download</a>`;
            fileDisplayList.appendChild(item);
        }

        function switchDeviceModeManual() {
            const pc = document.getElementById('pc-view');
            const phone = document.getElementById('phone-view');
            if (pc.style.display === 'none') { pc.style.display = 'block'; phone.style.display = 'none'; initPCServerNode(); } 
            else { pc.style.display = 'none'; phone.style.display = 'block'; if(myPeer) myPeer.destroy(); }
        }
    </script>
</body>
</html>
