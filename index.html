<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Serverless File Share</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-bottom: 5px; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 14px; text-align: center; }

        /* কানেকশন প্যানেল */
        .connection-panel {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .disconnected { background: #7f1d1d; color: #fca5a5; }
        .connected { background: #14532d; color: #86efac; }

        .qr-area {
            background: #fff;
            padding: 10px;
            display: inline-block;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        #reader {
            width: 100%;
            max-width: 260px;
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            font-size: 13px;
        }
        .btn-danger { background: #ef4444; color: white; display: none; }
        .btn-secondary { background: #475569; color: white; font-size: 11px; }

        /* পাশাপাশি দুটি স্কয়ার বক্সের ওয়ার্কস্পেস */
        .workspace {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }

        .square-box {
            width: 320px;
            height: 320px;
            background: #1e293b;
            border: 3px dashed #475569;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
            outline: none;
        }

        #sender-box.dragover { border-color: #38bdf8; background: #1e2e4a; }
        .file-label { background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 15px; }
        #file-input { display: none; }

        .file-list { width: 100%; height: 70%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .file-item { background: #334155; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; text-align: left; }
        .file-info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .download-btn { background: #22c55e; color: white; padding: 6px 12px; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; }

        /* ম্যানুয়াল টোকেন এরিয়া */
        .token-box { margin-top: 10px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; display: none; }
        textarea { width: 100%; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 6px; box-sizing: border-box; font-family: monospace; font-size: 11px; resize: none; margin-bottom: 5px; }

        /* হিস্ট্রি সেকশন */
        .history-box { background: #1e293b; padding: 15px; border-radius: 12px; width: 100%; max-width: 500px; margin-top: 25px; text-align: left; }
        .history-item { font-size: 12px; color: #94a3b8; padding: 6px 0; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

    <h2>Instant P2P File Share</h2>
    <p class="subtitle">Drag & Drop Files after Connecting. Works Online & Offline!</p>

    <div class="connection-panel">
        <span id="connection-status" class="status-badge disconnected">🔴 Disconnected</span>
        <br>
        
        <div id="qr-zone">
            <div class="qr-area" id="qrcode"></div>
            <p style="font-size: 11px; color: #94a3b8; margin: 0 0 10px 0;">PC: Scan this code using Mobile</p>
        </div>

        <button class="btn" id="scan-btn" onclick="toggleCamera()">📷 Scan QR (Mobile)</button>
        <button class="btn btn-danger" id="disconnect-btn" onclick="disconnectDevices()">Disconnect</button>
        <button class="btn btn-secondary" onclick="toggleManualBox()">Manual Token Option</button>

        <div id="reader"></div>

        <div class="token-box" id="manual-box">
            <label style="font-size: 11px; color: #38bdf8; display:block; margin-bottom:3px;">Your Connection Token:</label>
            <textarea id="my-token" rows="2" readonly onclick="this.select()"></textarea>
            <button class="btn" id="copy-btn" style="padding:4px 10px; font-size:11px;" onclick="copyMyToken()">Copy Code</button>
            
            <hr style="border-color: #334155; margin: 10px 0;">
            
            <label style="font-size: 11px; color: #a855f7; display:block; margin-bottom:3px;">Paste Partner's Token Here:</label>
            <textarea id="partner-token" rows="2" placeholder="Paste copied token here..."></textarea>
            <button class="btn" style="background:#22c55e; color:white; padding:5px 12px;" onclick="connectWithManualToken()">Connect Devices</button>
        </div>
    </div>

    <div class="workspace">
        <div class="square-box" id="sender-box" tabindex="0">
            <div style="font-size: 40px; margin-bottom: 5px;">📁</div>
            <p style="margin: 0 0 5px 0; font-weight: 500; font-size:15px;">Drag & Drop files here</p>
            <p style="margin: 0; color: #64748b; font-size: 12px;">or Click & Paste (Ctrl+V)</p>
            <label for="file-input" class="file-label">Browse Files</label>
            <input type="file" id="file-input" multiple>
        </div>

        <div class="square-box" id="receiver-box">
            <div style="font-size: 40px; margin-bottom: 5px;">📥</div>
            <p style="margin: 0 0 10px 0; font-weight: 500; font-size:15px;">Received Files</p>
            <div class="file-list" id="file-display-list">
                <p id="empty-message" style="color: #94a3b8; font-size: 13px; margin: auto;">No files received yet.</p>
            </div>
        </div>
    </div>

    <div class="history-box">
        <h4 style="margin: 0 0 8px 0; color: #38bdf8; font-size:14px;">📋 Transfer History</h4>
        <div id="history-list">
            <p style="color: #64748b; font-size: 12px; margin: 0;">No logs found.</p>
        </div>
    </div>

    <script>
        const senderBox = document.getElementById('sender-box');
        const fileInput = document.getElementById('file-input');
        const fileDisplayList = document.getElementById('file-display-list');
        const emptyMessage = document.getElementById('empty-message');
        const statusBadge = document.getElementById('connection-status');
        const qrZone = document.getElementById('qr-zone');
        const scanBtn = document.getElementById('scan-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');

        let peerConnection;
        let dataChannel;
        let html5QrcodeScanner;
        let receivedChunks = [];
        let currentFileName = "";
        let currentFileType = "";

        // দ্রুত কানেকশনের জন্য অপ্টিমাইজড কনফিগারেশন
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // পেজ লোড হলেই স্বয়ংক্রিয়ভাবে কিউআর কোড জেনারেট হয়ে যাবে পিসির জন্য
        window.onload = () => {
            initConnection();
            loadHistory();
        };

        function initConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            dataChannel = peerConnection.createDataChannel("fileChannel");
            setupChannelEvents(dataChannel);

            peerConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                setupChannelEvents(dataChannel);
            };

            peerConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    // QR কোড অনেক ছোট ও ফাস্ট করার জন্য টোকেন ডেটা মিনিফাই করা হয়েছে 
                    const token = btoa(JSON.stringify(peerConnection.localDescription));
                    document.getElementById('my-token').value = token;
                    generateFastQR(token);
                }
            };
            peerConnection.createOffer().then(o => peerConnection.setLocalDescription(o));
        }

        // সুপার ফাস্ট স্ক্যানিং কিউআর কোড জেনারেটর
        function generateFastQR(text) {
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: text,
                width: 170,
                height: 170,
                correctLevel : QRCode.CorrectLevel.L // ডাটা ডেনসিটি কমিয়ে দ্রুত রিডিং নিশ্চিত করে
            });
        }

        // ক্যামেরা স্ক্যানার অন/অফ লজিক (মোবাইলের জন্য)
        function toggleCamera() {
            const reader = document.getElementById('reader');
            if (reader.style.display === 'block') {
                stopCamera();
            } else {
                reader.style.display = 'block';
                qrZone.style.display = 'none';
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, { fps: 25, qrbox: 210 }, // হাই স্পিড এফপিএস ট্র্যাকিং
                    (qrText) => {
                        stopCamera();
                        processToken(qrText);
                    }
                ).catch(() => alert("Camera error or permission denied."));
            }
        }

        function stopCamera() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    qrZone.style.display = 'block';
                });
            }
        }

        // কিউআর কোড বা ম্যানুয়াল পেস্ট প্রসেস করে অটোমেটিক কানেক্ট করার ফাংশন
        function processToken(encodedToken) {
            try {
                const decoded = atob(encodedToken);
                const sessionDesc = new RTCSessionDescription(JSON.parse(decoded));
                
                peerConnection.setRemoteDescription(sessionDesc).then(() => {
                    if (sessionDesc.type === 'offer') {
                        peerConnection.createAnswer().then(answer => {
                            peerConnection.setLocalDescription(answer).then(() => {
                                const responseToken = btoa(JSON.stringify(peerConnection.localDescription));
                                document.getElementById('my-token').value = responseToken;
                                generateFastQR(responseToken); // অন্য ডিভাইসের জন্য পালটা অটো কিউআর কোড
                            });
                        });
                    }
                });
            } catch (err) {
                alert("ভুল কিউআর কোড বা টোকেন ডাটা!");
            }
        }

        // ম্যানুয়াল টোকেন কানেক্ট মেকানিজম (যদি ক্যামেরা দিয়ে স্ক্যান না হয়)
        function connectWithManualToken() {
            const val = document.getElementById('partner-token').value.trim();
            if(!val) return alert("অনুগ্রহ করে বক্সে টোকেনটি পেস্ট করুন!");
            processToken(val);
        }

        function toggleManualBox() {
            const box = document.getElementById('manual-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function copyMyToken() {
            document.getElementById('my-token').select();
            document.execCommand('copy');
            document.getElementById('copy-btn').innerText = "Copied!";
            setTimeout(() => document.getElementById('copy-btn').innerText = "Copy Code", 2000);
        }

        // ডেটা চ্যানেল ইভেন্টস
        function setupChannelEvents(channel) {
            channel.binaryType = 'arraybuffer';
            channel.onopen = () => {
                statusBadge.className = "status-badge connected";
                statusBadge.innerText = "🟢 Connected Successfully!";
                qrZone.style.display = 'none';
                scanBtn.style.display = 'none';
                disconnectBtn.style.display = 'inline-block';
                document.getElementById('manual-box').style.display = 'none';
                saveHistoryLog();
            };

            channel.onclose = () => { handleReset(); };

            channel.onmessage = (e) => {
                if (typeof e.data === 'string') {
                    const meta = JSON.parse(e.data);
                    currentFileName = meta.name;
                    currentFileType = meta.type;
                    receivedChunks = [];
                } else {
                    receivedChunks.push(e.data);
                    if (e.data.byteLength < 16384) { 
                        const blob = new Blob(receivedChunks, { type: currentFileType });
                        displayReceivedFile(currentFileName, blob);
                    }
                }
            };
        }

        // ডিসকানেক্ট মেকানিজম (যাতে পরে ফ্রেশ ভাবে আবার স্ক্যান করা যায়)
        function disconnectDevices() {
            if(peerConnection) peerConnection.close();
            handleReset();
            initConnection(); 
        }

        function handleReset() {
            statusBadge.className = "status-badge disconnected";
            statusBadge.innerText = "🔴 Disconnected";
            qrZone.style.display = 'block';
            scanBtn.style.display = 'inline-block';
            disconnectBtn.style.display = 'none';
            document.getElementById('partner-token').value = "";
        }

        // ফাইল ট্রান্সফার পাঠানো (Chunks আকারে)
        function handleFiles(files) {
            if (!dataChannel || dataChannel.readyState !== "open") {
                return alert("ডিভাইস কানেক্টেড নেই! আগে কিউআর কোড স্ক্যান বা টোকেন দিয়ে কানেক্ট করুন।");
            }

            Array.from(files).forEach(file => {
                dataChannel.send(JSON.stringify({ name: file.name, type: file.type }));
                const chunkSize = 16384;
                const reader = new FileReader();
                let offset = 0;

                reader.onload = (e) => {
                    dataChannel.send(e.target.result);
                    offset += e.target.result.byteLength;
                    if (offset < file.size) readNextChunk();
                };

                function readNextChunk() {
                    const slice = file.slice(offset, offset + chunkSize);
                    reader.readAsArrayBuffer(slice);
                }
                readNextChunk();
            });
        }

        // ১. ড্র্যাগ অ্যান্ড ড্রপ (Drag & Drop) কোড
        senderBox.addEventListener('dragover', (e) => { e.preventDefault(); senderBox.classList.add('dragover'); });
        senderBox.addEventListener('dragleave', () => senderBox.classList.remove('dragover'));
        senderBox.addEventListener('drop', (e) => {
            e.preventDefault();
            senderBox.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // ২. কপি এবং পেস্ট (Copy-Paste) কোড
        senderBox.addEventListener('click', () => senderBox.focus());
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const fileList = [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') {
                    const file = items[i].getAsFile();
                    if (file) fileList.push(file);
                }
            }
            if (fileList.length > 0) handleFiles(fileList);
        });

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        // রিসিভড বক্স ফাইল ডিসপ্লে ও ডাউনলোড বাটন জেনারেশন
        function displayReceivedFile(fileName, blobData) {
            if (emptyMessage) emptyMessage.style.display = 'none';
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            const downloadUrl = URL.createObjectURL(blobData);
            fileItem.innerHTML = `
                <div class="file-info" title="${fileName}">${fileName}</div>
                <a href="${downloadUrl}" download="${fileName}" class="download-btn">Download</a>
            `;
            fileDisplayList.appendChild(fileItem);
        }

        // কানেকশন হিস্ট্রি ম্যানেজমেন্ট (Local Storage)
        function saveHistoryLog() {
            let log = JSON.parse(localStorage.getItem('p2p_share_log')) || [];
            const time = new Date().toLocaleString();
            const platform = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "Mobile Node" : "Desktop Node";
            log.unshift({ device: platform, date: time });
            if(log.length > 4) log.pop();
            localStorage.setItem('p2p_share_log', JSON.stringify(log));
            renderHistoryLog(log);
        }

        function loadHistory() {
            let log = JSON.parse(localStorage.getItem('p2p_share_log')) || [];
            renderHistoryLog(log);
        }

        function renderHistoryLog(log) {
            if(log.length === 0) return;
            document.getElementById('history-list').innerHTML = log.map(item => `
                <div class="history-item">
                    🔗 Connected via <b>${item.device}</b> <span style="float:right; font-size:11px; color:#64748b;">${item.date}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
