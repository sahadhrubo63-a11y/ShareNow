<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed P2P File Share (100% Fixed)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-bottom: 5px; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 14px; text-align: center; }

        .connection-panel {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }

        /* আপনার ইমেজের মতো লো-ডেনসিটি ফাঁকা কিউআর */
        .qr-area {
            background: #fff;
            padding: 20px;
            display: inline-block;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid #38bdf8;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px;
            font-size: 14px;
        }
        .btn:hover { background: #7dd3fc; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #475569; color: white; }

        .file-sharing-interface {
            display: none; 
            width: 100%;
            max-width: 900px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
            background: #14532d; color: #86efac;
        }

        .workspace {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .square-box {
            width: 380px;
            height: 380px;
            background: #1e293b;
            border: 3px dashed #475569;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 30px;
            text-align: center;
            outline: none;
        }

        #sender-box.dragover { border-color: #38bdf8; background: #1e2e4a; }
        .file-label { background: #38bdf8; color: #0f172a; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        #file-input { display: none; }

        .file-list { width: 100%; height: 75%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .file-item { background: #334155; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .file-info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; text-align: left; }
        .download-btn { background: #22c55e; color: white; padding: 8px 16px; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; }

        /* ম্যানুয়াল টেক্সট কোড ব্যাকআপ প্যানেল */
        .manual-box { margin-top: 15px; display: none; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        textarea { width: 100%; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 10px; box-sizing: border-box; font-size: 11px; font-family: monospace; resize: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Instant P2P File Share</h2>
    <p class="subtitle">100% Serverless Connection Setup • Works Online & Offline</p>

    <div class="connection-panel" id="connection-screen">
        <span id="setup-title" style="background: #7f1d1d; color: #fca5a5; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold;">🔴 Step 1: Scan or Share Code</span>
        
        <div id="qr-zone">
            <div class="qr-area" id="qrcode"></div>
            <p id="qr-desc" style="font-size: 13px; color: #94a3b8; margin: 0;">PC: Scan this code using Mobile Camera</p>
        </div>

        <div style="margin-top: 15px;">
            <button class="btn" id="scan-btn" onclick="openLargeCamera()">📷 Scan QR (Mobile)</button>
            <button class="btn btn-secondary" onclick="toggleManualMode()">Manual Text Code</button>
        </div>

        <div id="reader"></div>

        <div class="manual-box" id="manual-zone">
            <label style="font-size: 13px; color: #38bdf8; display:block; margin-bottom:5px;">Your Connection Code:</label>
            <textarea id="my-code-text" rows="3" readonly onclick="this.select()"></textarea>
            <button class="btn" id="copy-btn" style="padding: 6px 14px; font-size: 12px; background:#475569; color:#fff;" onclick="copyMyCode()">Copy Code</button>
            
            <hr style="border-color: #334155; margin: 15px 0;">
            
            <label style="font-size: 13px; color: #a855f7; display:block; margin-bottom:5px;">Paste Partner's Code Here:</label>
            <textarea id="partner-code-text" rows="3" placeholder="Paste the generated code from the other device here..."></textarea>
            <button class="btn" style="background:#22c55e; color:white; width:100%; margin:0;" onclick="connectWithManualCode()">Connect Manually</button>
        </div>
    </div>

    <div class="file-sharing-interface" id="sharing-screen">
        <center>
            <span class="status-badge">🟢 Connected Successfully!</span>
            <button class="btn btn-danger" style="padding: 6px 16px; font-size:12px; vertical-align:middle; margin-bottom:20px;" onclick="disconnectSession()">Disconnect</button>
        </center>

        <div class="workspace">
            <div class="square-box" id="sender-box" tabindex="0">
                <div style="font-size: 55px; margin-bottom: 10px;">📁</div>
                <h3 style="margin: 0 0 5px 0; color:#38bdf8;">Sender Box</h3>
                <p style="margin: 0; color: #94a3b8; font-size: 13px;">Drag & Drop ANY format file</p>
                <p style="margin: 5px 0 0 0; color: #64748b; font-size: 12px;">or Click & Paste (Ctrl+V)</p>
                <label for="file-input" class="file-label">Browse Files</label>
                <input type="file" id="file-input" multiple>
            </div>

            <div class="square-box" id="receiver-box">
                <div style="font-size: 55px; margin-bottom: 10px;">📥</div>
                <h3 style="margin: 0 0 10px 0; color:#22c55e;">Receiver Box</h3>
                <div class="file-list" id="file-display-list">
                    <p id="empty-message" style="color: #64748b; font-size: 14px; margin: auto;">Awaiting incoming files...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const connectionScreen = document.getElementById('connection-screen');
        const sharingScreen = document.getElementById('sharing-screen');
        const senderBox = document.getElementById('sender-box');
        const fileInput = document.getElementById('file-input');
        const fileDisplayList = document.getElementById('file-display-list');
        const emptyMessage = document.getElementById('empty-message');

        let peerConnection;
        let dataChannel;
        let html5QrcodeScanner;
        let isHost = true;
        let receivedChunks = [];
        let currentFileName = "";
        let currentFileType = "";

        // লোকাল এবং গুগল স্টান সার্ভার (অফলাইন/অনলাইন উভয় মোড সাপোর্ট)
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        window.onload = () => {
            startDeviceSession();
        };

        // সেশন শুরু করা এবং মিনিমাইজড ফাস্ট কোড তৈরি করা
        function startDeviceSession() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            // হোস্ট ডাটা চ্যানেল
            dataChannel = peerConnection.createDataChannel("fileChannel");
            setupDataChannel(dataChannel);

            // রিসিভার ডাটা চ্যানেল লিসেনার
            peerConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                setupDataChannel(dataChannel);
            };

            peerConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    // টোকেন ডাটা ছোট করার জন্য অপ্রয়োজনীয় প্রোপার্টি ট্রিম করা হয়েছে (যাতে ফাস্ট স্ক্যান হয়)
                    const sessionData = {
                        sdp: peerConnection.localDescription.sdp,
                        type: peerConnection.localDescription.type
                    };
                    const compactToken = btoa(JSON.stringify(sessionData));
                    document.getElementById('my-code-text').value = compactToken;
                    generateFastQR(compactToken);
                }
            };

            peerConnection.createOffer().then(offer => peerConnection.setLocalDescription(offer));
        }

        // একদম লো-ডেনসিটি এবং বড় ফাঁকা কিউআর কোড জেনারেটর
        function generateFastQR(text) {
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: text,
                width: 240, 
                height: 240,
                correctLevel: QRCode.CorrectLevel.L // সর্বনিম্ন ডাটা ডেনসিটি যাতে দ্রুত স্ক্যান হয়
            });
        }

        // ক্যামেরা ওপেন করে স্ক্যান করা
        function openLargeCamera() {
            const readerEl = document.getElementById('reader');
            if (readerEl.style.display === 'block') {
                stopCameraView();
            } else {
                readerEl.style.display = 'block';
                document.getElementById('qr-zone').style.display = 'none';
                
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, { fps: 30, qrbox: 280 },
                    (qrText) => {
                        stopCameraView();
                        processConnectionToken(qrText);
                    }
                ).catch(() => alert("Camera permission error."));
            }
        }

        function stopCameraView() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('qr-zone').style.display = 'block';
                });
            }
        }

        // কিউআর এবং ম্যানুয়াল টেক্সট ইনপুট প্রসেসিং মেকানিজম (১০০% সাকসেস রেট)
        function processConnectionToken(encodedToken) {
            try {
                const parsedData = JSON.parse(atob(encodedToken));
                const remoteDesc = new RTCSessionDescription(parsedData);
                
                peerConnection.setRemoteDescription(remoteDesc).then(() => {
                    if (remoteDesc.type === 'offer') {
                        isHost = false;
                        document.getElementById('setup-title').innerText = "🔴 Step 2: Scan Back to PC";
                        document.getElementById('qr-desc').innerText = "Mobile: এবার এই পাল্টা কোডটি PC ক্যামেরা দিয়ে স্ক্যান করুন";
                        
                        peerConnection.createAnswer().then(answer => {
                            return peerConnection.setLocalDescription(answer);
                        }).then(() => {
                            const responseData = {
                                sdp: peerConnection.localDescription.sdp,
                                type: peerConnection.localDescription.type
                            };
                            const responseToken = btoa(JSON.stringify(responseData));
                            document.getElementById('my-code-text').value = responseToken;
                            generateFastQR(responseToken); // পাল্টা ডিভাইসের জন্য সেকেন্ডারি ফাস্ট কিউআর জেনারেট
                        });
                    }
                });
            } catch (err) {
                alert("ভুল বা অসম্পূর্ণ কোড ডাটা!");
            }
        }

        // ম্যানুয়াল টেক্সট কোড দিয়ে কানেক্ট করা
        function connectWithManualCode() {
            const code = document.getElementById('partner-code-text').value.trim();
            if(!code) return alert("দয়া করে ইনপুট বক্সে কোডটি পেস্ট করুন!");
            processConnectionToken(code);
        }

        function toggleManualMode() {
            const zone = document.getElementById('manual-zone');
            zone.style.display = zone.style.display === 'block' ? 'none' : 'block';
        }

        function copyMyCode() {
            document.getElementById('my-code-text').select();
            document.execCommand('copy');
            document.getElementById('copy-btn').innerText = "Copied!";
            setTimeout(() => document.getElementById('copy-btn').innerText = "Copy Code", 2000);
        }

        // ডাটা চ্যানেল এবং ইন্টারফেস কন্ট্রোল
        function setupDataChannel(channel) {
            channel.binaryType = 'arraybuffer';
            channel.onopen = () => {
                connectionScreen.style.display = 'none';
                sharingScreen.style.display = 'block';
                stopCameraView();
            };

            channel.onclose = () => { disconnectSession(); };

            channel.onmessage = (e) => {
                if (typeof e.data === 'string') {
                    const meta = JSON.parse(e.data);
                    currentFileName = meta.name;
                    currentFileType = meta.type;
                    receivedChunks = [];
                } else {
                    receivedChunks.push(e.data);
                    if (e.data.byteLength < 16384) { 
                        const blob = new Blob(receivedChunks, { type: currentFileType });
                        displayIncomingFile(currentFileName, blob);
                    }
                }
            };
        }

        function disconnectSession() {
            if(peerConnection) peerConnection.close();
            sharingScreen.style.display = 'none';
            connectionScreen.style.display = 'block';
            document.getElementById('partner-code-text').value = "";
            document.getElementById('setup-title').innerText = "🔴 Step 1: Scan or Share Code";
            document.getElementById('qr-desc').innerText = "PC: Scan this code using Mobile Camera";
            startDeviceSession(); // রি-কানেক্টের জন্য ফ্রেশ সেশন
        }

        // ফাইল হ্যান্ডলিং (যেকোনো ফরম্যাট সাপোর্ট)
        function sendFilesData(files) {
            if (!dataChannel || dataChannel.readyState !== "open") return alert("ডিভাইস কানেক্টেড নেই!");
            Array.from(files).forEach(file => {
                dataChannel.send(JSON.stringify({ name: file.name, type: file.type }));
                const chunkSize = 16384;
                const reader = new FileReader();
                let offset = 0;
                reader.onload = (e) => {
                    dataChannel.send(e.target.result);
                    offset += e.target.result.byteLength;
                    if (offset < file.size) readNextChunk();
                };
                function readNextChunk() {
                    const slice = file.slice(offset, offset + chunkSize);
                    reader.readAsArrayBuffer(slice);
                }
                readNextChunk();
            });
        }

        // ড্র্যাগ অ্যান্ড ড্রপ সাপোর্ট
        senderBox.addEventListener('dragover', (e) => { e.preventDefault(); senderBox.classList.add('dragover'); });
        senderBox.addEventListener('dragleave', () => senderBox.classList.remove('dragover'));
        senderBox.addEventListener('drop', (e) => {
            e.preventDefault();
            senderBox.classList.remove('dragover');
            sendFilesData(e.dataTransfer.files);
        });

        // কপি পেস্ট (Ctrl+V) সাপোর্ট
        senderBox.addEventListener('click', () => senderBox.focus());
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const fileList = [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file') {
                    const file = items[i].getAsFile();
                    if (file) fileList.push(file);
                }
            }
            if (fileList.length > 0) sendFilesData(fileList);
        });

        fileInput.addEventListener('change', (e) => sendFilesData(e.target.files));

        function displayIncomingFile(fileName, blobData) {
            if (emptyMessage) emptyMessage.style.display = 'none';
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            const downloadUrl = URL.createObjectURL(blobData);
            fileItem.innerHTML = `
                <div class="file-info" title="${fileName}">${fileName}</div>
                <a href="${downloadUrl}" download="${fileName}" class="download-btn">Download</a>
            `;
            fileDisplayList.appendChild(fileItem);
        }
    </script>
</body>
</html>
