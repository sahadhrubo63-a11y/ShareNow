<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Connect & History</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .panel { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .disconnected { background: #7f1d1d; color: #fca5a5; }
        .connected { background: #14532d; color: #86efac; }
        .qr-box { background: #fff; padding: 10px; display: inline-block; border-radius: 8px; margin: 15px 0; }
        #reader { width: 100%; max-width: 280px; margin: 15px auto; border-radius: 8px; overflow: hidden; display: none; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-danger { background: #ef4444; color: white; display: none; }
        .history-box { background: #1e293b; padding: 15px; border-radius: 12px; max-width: 450px; margin: 20px auto; text-align: left; }
        .history-item { font-size: 13px; color: #94a3b8; padding: 5px 0; border-bottom: 1px solid #334155; }
        textarea { width: 100%; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 8px; box-sizing: border-box; font-size: 11px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <h2>Instant QR Link</h2>
    
    <div class="panel">
        <span id="status" class="status disconnected">🔴 Disconnected</span>
        <br>
        
        <div id="qr-container">
            <div class="qr-box" id="qrcode"></div>
            <p style="font-size: 12px; color: #94a3b8; margin: 0;">PC: Scan this from Mobile</p>
        </div>

        <button class="btn" id="scan-btn" onclick="toggleScanner()">📷 Scan QR (Mobile)</button>
        <button class="btn btn-danger" id="disconnect-btn" onclick="disconnectDevices()">Disconnect</button>
        
        <div id="reader"></div>

        <button class="btn" id="manual-toggle-btn" style="background:#475569; color:#fff; font-size:11px;" onclick="toggleManualInput()">Manual Token</button>
        <div id="manual-area">
            <textarea id="token-input" rows="2" placeholder="Paste partner token here..."></textarea>
            <button class="btn" id="connect-manual-btn" style="display:none; background:#22c55e; color:#fff;" onclick="connectManually()">Connect</button>
        </div>
    </div>

    <div class="history-box">
        <h4 style="margin: 0 0 10px 0; color: #38bdf8;">📋 Connection History</h4>
        <div id="history-list">
            <p style="color: #64748b; font-size: 13px; margin: 0;">No history available.</p>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const qrContainer = document.getElementById('qr-container');
        const scanBtn = document.getElementById('scan-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const tokenInput = document.getElementById('token-input');
        const connectManualBtn = document.getElementById('connect-manual-btn');
        const historyList = document.getElementById('history-list');

        let peerConnection;
        let dataChannel;
        let html5QrcodeScanner;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // অ্যাপ লোড হলেই পিসির জন্য অটোমেটিক OFFER তৈরি হবে
        window.onload = () => {
            initConnection();
            loadHistory();
        };

        function initConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            // ডেটা চ্যানেল তৈরি (হোস্ট হিসেবে)
            dataChannel = peerConnection.createDataChannel("transferChannel");
            setupChannelEvents(dataChannel);

            // রিসিভার হিসেবে পাল্টা চ্যানেল হ্যান্ডেল করা
            peerConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                setupChannelEvents(dataChannel);
            };

            peerConnection.onicecandidate = (e) => {
                if (!e.candidate) {
                    const token = btoa(JSON.stringify(peerConnection.localDescription));
                    generateQR(token);
                }
            };

            peerConnection.createOffer().then(offer => peerConnection.setLocalDescription(offer));
        }

        // দ্রুত QR কোড জেনারেট করা (Low Density)
        function generateQR(text) {
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: text, width: 180, height: 180,
                correctLevel : QRCode.CorrectLevel.L // দ্রুত স্ক্যান হওয়ার জন্য লো ডেনসিটি
            });
        }

        // মোবাইল ক্যামেরা স্ক্যানার টগল
        function toggleScanner() {
            const readerEl = document.getElementById('reader');
            if (readerEl.style.display === 'block') {
                stopCamera();
            } else {
                readerEl.style.display = 'block';
                qrContainer.style.display = 'none';
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, { fps: 20, qrbox: 220 }, // দ্রুত ট্র্যাকিংয়ের জন্য FPS ২০ করা হয়েছে
                    (qrText) => {
                        stopCamera();
                        processToken(qrText);
                    }
                ).catch(() => alert("Camera error or permission denied."));
            }
        }

        function stopCamera() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    qrContainer.style.display = 'block';
                });
            }
        }

        // টোকেন প্রসেস ও অটো-কানেক্ট
        function processToken(encodedToken) {
            try {
                const token = atob(encodedToken);
                const desc = new RTCSessionDescription(JSON.parse(token));
                
                peerConnection.setRemoteDescription(desc).then(() => {
                    if (desc.type === 'offer') {
                        peerConnection.createAnswer().then(answer => {
                            peerConnection.setLocalDescription(answer).then(() => {
                                // মোবাইলের জেনারেট করা অ্যান্সার অটোমেটিকভাবে পিসিতে পুশ করার ব্যাকআপ ট্রিক
                                const ansToken = btoa(JSON.stringify(peerConnection.localDescription));
                                // যদি লোকাললি কানেক্ট না হয়, তবে পিসিতে ইনপুট দেওয়ার জন্য এটি স্ক্রিনে দেখাবে
                                generateQR(ansToken); 
                            });
                        });
                    }
                });
            } catch (e) {
                alert("Invalid QR or Token!");
            }
        }

        // ম্যানুয়াল কানেকশন অপশন টগল
        function toggleManualInput() {
            const show = tokenInput.style.display === 'block';
            tokenInput.style.display = show ? 'none' : 'block';
            connectManualBtn.style.display = show ? 'none' : 'inline-block';
        }

        function connectManually() {
            processToken(tokenInput.value.trim());
        }

        // ডেটা চ্যানেল ইভেন্টস এবং স্ট্যাটাস চেঞ্জার
        function setupChannelEvents(channel) {
            channel.onopen = () => {
                statusEl.className = "status connected";
                statusEl.innerText = "🟢 Connected Successfully!";
                qrContainer.style.display = 'none';
                scanBtn.style.display = 'none';
                disconnectBtn.style.display = 'inline-block';
                saveHistory();
            };

            channel.onclose = () => {
                resetUI();
            };
        }

        // ডিসকানেক্ট মেকানিজম (যাতে পরে আবার স্ক্যান করা যায়)
        function disconnectDevices() {
            if (peerConnection) {
                peerConnection.close();
            }
            resetUI();
            initConnection(); // পুনরায় নতুন স্ক্যানের জন্য কোড জেনারেট করা
        }

        function resetUI() {
            statusEl.className = "status disconnected";
            statusEl.innerText = "🔴 Disconnected";
            qrContainer.style.display = 'block';
            scanBtn.style.display = 'inline-block';
            disconnectBtn.style.display = 'none';
            tokenInput.value = "";
        }

        // কানেকশন হিস্ট্রি লোকাল স্টোরেজে সেভ করা
        function saveHistory() {
            let history = JSON.parse(localStorage.getItem('p2p_history')) || [];
            const timeStamp = new Date().toLocaleString();
            const deviceType = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "Mobile Device" : "PC/Desktop";
            
            history.unshift({ device: deviceType, time: timeStamp });
            if(history.length > 5) history.pop(); // সর্বোচ্চ ৫টি হিস্ট্রি রাখবে
            
            localStorage.setItem('p2p_history', JSON.stringify(history));
            renderHistory(history);
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('p2p_history')) || [];
            renderHistory(history);
        }

        function renderHistory(history) {
            if(history.length === 0) return;
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    📍 Connected to <b>${item.device}</b> <span style="float:right; font-size:11px;">${item.time}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
